services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recallflow
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: recallflow
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - recallflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallflow"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  recallflow-postgres:
